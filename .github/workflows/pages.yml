# O site oficial está em https://paradavirmond.com.br (Hostinger).
# O endereço antigo da prévia no GitHub Pages só redireciona para ele.
# Prévia antiga: https://alexjrborchert.github.io/auto-posto-virmond/
name: Redirecionar prévia antiga

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
